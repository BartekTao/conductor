name: API Request Audit validation

on:
  push:
    branches:
      - feature/conductor-api-request-audit-3.21.22
  pull_request:
    paths:
      - "server/src/main/java/com/netflix/conductor/observability/**"
      - "server/src/test/java/com/netflix/conductor/observability/**"
      - ".github/workflows/api-request-audit.yml"
  workflow_dispatch:

jobs:
  server-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle compile
        run: ./gradlew :conductor-server:compileJava --no-daemon
      - name: Focused request audit unit tests
        run: ./gradlew :conductor-server:test --tests '*ApiRequestAuditFilterTest' --no-daemon
